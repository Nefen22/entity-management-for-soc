name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Integration Tests
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
