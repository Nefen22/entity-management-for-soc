version: '3.8'

services:
  neo4j-test:
    image: neo4j:5.18
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]

    networks:
      - app-test

    healthcheck:
      test: ["CMD","cypher-shell","-u","neo4j","-p","password123","RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-test:
    build: .
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - PYTHONPATH=/app:/app/backend
      - TESTING_IN_DOCKER=true
      - NEO4J_URI=bolt://neo4j-test:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - RESET_DB=true
      - SEED_DATA=true
      - SEED_NAME=TEST
    volumes:
      - .:/app
      - ./backend/enrichment/data:/app/backend/enrichment/data
    networks:
      - app-test
    depends_on:
      neo4j-test:
        condition: service_healthy
    command: ["pytest", "-vs", "--cov=backend", "--cov-report=term-missing"]

networks:
  app-test:
    driver: bridge