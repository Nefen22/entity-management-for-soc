services:
  neo4j:
    image: neo4j:5.18
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"] 
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "neo4j",
          "-p",
          "password123",
          "--encryption",
          "false",
          "RETURN 1;"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - app

  api:
    build: .
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/backend
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - RESET_DB=true
      - SEED_NAME=DEMO
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
      - ./backend/data:/data
    networks:
      - app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app
volumes:
  neo4j_data:

networks:
  app:
    driver: bridge