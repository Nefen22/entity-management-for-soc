services:
  neo4j:
    image: neo4j:5.18
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - app

  api:
    build: .
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app/backend
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    volumes:
      - .:/app
    networks:
      - app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neo4j_data:

networks:
  app:
    driver: bridge