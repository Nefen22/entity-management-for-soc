

<!DOCTYPE html>
<html>
<head>
    <title>Entity Management</title>
</head>
<body>
    <h1>IP Entity</h1>
    <div id="entity-detail"></div>

    <script>
        async function loadEntities() {
            const response = await fetch('http://localhost:8000/api/entities/ips');
            const res = await response.json();
            let html = '';
            res.data.forEach(element => {
                const ip = element.ips;
                html += `<li>
                    ${ip.value} - ${ip.country_name || 'N/A'} (ASN: ${ip.asn || 'N/A'})
                    <button onclick = "EnrichIP('${ip.value}')"> Enrich </button>
                    <button onclick = "GraphIP('${ip.value}')"> Graph </button>
                    <div id = 'detail-${ip.value}'></div>
                    </li>`;});
            document.getElementById('entity-detail').innerHTML = html
        }
        async function GraphIP(value){
            const detail = await fetch(`http://localhost:8000/api/graph/ips/${value}/2`, {method: 'GET'});
            const sub = await detail.json();
            const data = sub["data"];
            let html = '<ul>';
            data.forEach(list =>{
                html+=list.r
                    .map(rel =>`${rel[0].value} - ${rel[1]} -> ${rel[2].value}`).join("<br>");
            });
            html+='</ul>';
            document.getElementById(`detail-${value}`).innerHTML = html
        }
        async function EnrichIP(value){
            await fetch(`http://localhost:8000/api/enrichment/ips/${value}`, {method: 'POST'});
            loadEntities();
        }
        loadEntities();
    </script>
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <div id="cy" style="width:100%; height:600px; border:1px solid #ccc"></div>
</body>
</html>
