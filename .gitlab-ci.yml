stages:
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# ── Test stage ────────────────────────────────────────────────────────────────
test:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
    - docker compose version
  script:
    - docker compose -f docker-compose.test.yml up
        --build
        --abort-on-container-exit
        --exit-code-from api-test
  after_script:
    - docker compose -f docker-compose.test.yml down -v --remove-orphans
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'

# ── Build stage (chỉ chạy khi push lên main) ─────────────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  only:
    - main
  before_script:
    - docker info
  script:
    - docker build -t entity-management-soc:latest .
    - echo "Build completed successfully"