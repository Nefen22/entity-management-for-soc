stages:
  - test
  - build
  - scan

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: entity-management-soc-test:latest

test:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
    - docker compose version
  script:
    - docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from api-test
  after_script:
    - docker compose -f docker-compose.test.yml down -v --remove-orphans
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
  script:
    - docker build -t $IMAGE_NAME .
    - docker save $IMAGE_NAME -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

scan_trivy:
  stage: scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""] 
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table